name: Reiseführer prüfen

on:
  pull_request:
    paths:
      - "deckblatt.md"
      - "kapitel/**/*.md"
      - "bilder/**"
      - "buch.css"
      - "buch_erstellen.py"
      - "requirements.txt"
      - ".github/workflows/reisefuehrer-pruefen.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reisefuehrer-pruefen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Reiseführer bauen und prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Programme installieren
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Schriftarten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-color-emoji
          fc-cache -f

      - name: Leerzeichen und Konfliktmarker prüfen
        run: |
          git diff --check
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            --exclude-dir=.git \
            --exclude='WienGuide.html' \
            --exclude='WienGuide.pdf' \
            .; then
            echo "Konfliktmarker gefunden."
            exit 1
          fi

      - name: Reiseführer erstellen
        run: python buch_erstellen.py

      - name: Ergebnis als Prüfungsartefakt bereitstellen
        uses: actions/upload-artifact@v5
        with:
          name: WienGuide-pruefung
          path: |
            ausgabe/WienGuide.pdf
            ausgabe/WienGuide.html
          if-no-files-found: error
          retention-days: 7
