name: Reiseführer prüfen

on:
  pull_request:
    paths:
      - "deckblatt.md"
      - "kapitel/**"
      - "bilder/**"
      - "buch.css"
      - "buch_erstellen.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        default: WienGuide-pruefung
      retention_days:
        type: number
        default: 7
      strict_images:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: buch-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Gemeinsames Buch bauen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: PDF-Bibliotheken und Schriftarten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 fonts-noto-core fonts-noto-color-emoji fonts-dejavu-core
          fc-cache -f
          python -m pip install -r requirements.txt

      - name: Alte Ausgabe entfernen und Buchfunktionen testen
        run: |
          rm -rf ausgabe
          python -m unittest discover -s tests -v

      - name: Reiseführer erstellen
        env:
          STRICT_IMAGES: ${{ github.event_name == 'pull_request' || inputs.strict_images }}
        run: |
          if [ "$STRICT_IMAGES" = "true" ]; then
            python buch_erstellen.py --strict-images
          else
            python buch_erstellen.py
          fi

      - name: Bauprotokoll in der Zusammenfassung anzeigen
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          bericht = Path('ausgabe/Bauprotokoll.json')
          if bericht.exists():
              daten = json.loads(bericht.read_text(encoding='utf-8'))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as ausgabe:
                  ausgabe.write('## WienGuide\n\n')
                  ausgabe.write(f"{len(daten['kapitel'])} Kapitel, {daten['eingebundene_bilder']} eingebundene Bilder.\n\n")
                  for kapitel in daten['kapitel']:
                      ausgabe.write(f"- {kapitel['titel']} (`{kapitel['datei']}`)\n")
                  for hinweis in daten['hinweise'] + daten['bildfehler']:
                      ausgabe.write(f'\n- Hinweis: {hinweis}\n')
          PY

      - name: Buch und Bauprotokoll herunterladen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact_name || 'WienGuide-pruefung' }}
          path: |
            ausgabe/WienGuide.pdf
            ausgabe/WienGuide.html
            ausgabe/Bauprotokoll.json
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days || 7 }}
