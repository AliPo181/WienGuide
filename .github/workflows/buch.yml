name: Reiseführer erstellen

on:
  push:
    branches: [main]
    paths:
      - "deckblatt.md"
      - "kapitel/**"
      - "bilder/**"
      - "buch.css"
      - "buch_erstellen.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buch:
    uses: ./.github/workflows/reisefuehrer-pruefen.yml
    with:
      artifact_name: WienGuide
      retention_days: 30
      strict_images: false
